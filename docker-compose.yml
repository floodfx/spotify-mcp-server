version: '3.8'

services:
  spotify-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spotify-mcp-server
    restart: unless-stopped
    ports:
      - "8888:8888"  # Spotify OAuth callback port
    volumes:
      # Mount config file for Spotify credentials
      - ./spotify-config.json:/app/spotify-config.json:ro
    environment:
      - NODE_ENV=production
    # Use host network for better localhost callback handling during auth
    network_mode: host
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Health check')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
